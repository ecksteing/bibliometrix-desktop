<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loading Biblioshiny…</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1f2a37;
      --muted: #5b6b7c;
      --accent: #1f6f8b;
      --ring: #d7e3ec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, #e7f2f7 0%, transparent 45%),
        var(--bg);
    }
    .card {
      width: min(420px, calc(100vw - 32px));
      background: var(--card);
      border: 1px solid var(--ring);
      border-radius: 16px;
      padding: 32px 28px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(31, 42, 55, 0.08);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
      font-weight: 650;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
      font-size: 0.98rem;
    }
    .spinner {
      width: 48px;
      height: 48px;
      margin: 0 auto 20px;
      border-radius: 50%;
      border: 4px solid #d9e7ee;
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      margin-top: 18px;
      font-size: 0.9rem;
      color: var(--accent);
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Starting Biblioshiny</h1>
    <p>Please wait while Bibliometrix Desktop prepares the app. This can take a little longer the first time.</p>
    <div class="status" id="status">Checking for the app…</div>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var target = params.get("target") || "http://127.0.0.1:3838/";
      var statusEl = document.getElementById("status");

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function probe() {
        setStatus("Waiting for Biblioshiny…");
        // no-cors: Shiny does not send CORS headers; opaque success means the server answered.
        fetch(target, { method: "GET", mode: "no-cors", cache: "no-store" })
          .then(function () {
            setStatus("Opening Biblioshiny…");
            window.location.replace(target);
          })
          .catch(function () {
            setTimeout(probe, 700);
          });
      }

      probe();
    })();
  </script>
</body>
</html>
